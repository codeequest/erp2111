packages:
  - apps/*
  - packages/*

# Dependencies allowed to run install scripts (pnpm 11).
# Native builds and Prisma engines are needed; scarf is install telemetry only.
allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  argon2: true
  esbuild: true
  prisma: true
